name: Tests and phantom evaluation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Run download-free phantom evaluation
        run: python -m bone_defect_planner demo --output artifacts --figures docs
      - name: Upload measured results and figures
        uses: actions/upload-artifact@v4
        with:
          name: phantom-evaluation
          path: |
            artifacts/
            docs/slice-overlay.png
            docs/mesh-render.png
          if-no-files-found: error
